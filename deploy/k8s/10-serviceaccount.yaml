---
# A dedicated ServiceAccount with no RoleBindings: the workload gets an identity
# for audit purposes but no API permissions whatsoever.
#
# automountServiceAccountToken is false here *and* on the pod spec. PyGoat is a
# deliberately exploitable application, and the default behaviour of mounting a
# usable API token at /var/run/secrets/kubernetes.io/serviceaccount turns any of
# its SSRF or file-read labs into a route to the Kubernetes API. Setting it in
# both places is intentional - the pod-level field is the one that binds, the
# ServiceAccount-level field is the safe default for anything that forgets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pygoat
  namespace: pygoat
  labels:
    app.kubernetes.io/name: pygoat
automountServiceAccountToken: false
